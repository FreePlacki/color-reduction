[package]
name = "color-reduction"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = {version = "0.32.3", default-features = false, features = ["default_fonts", "x11", "wayland", "glow"]}
image = {version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp"]}
# rfd = "0.15.4"

[profile.dev]
opt-level = 3
debug = true
overflow-checks = false
lto = false
panic = "unwind"
